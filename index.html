<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Розклад ІР-31</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            /* Глибока темна палітра з холодним сутінковим підтоном */
            --bg-page: #0b1113;        /* Дуже темна, майже чорна холодна основа */
            --bg-card: #121b1d;        /* Глибокий темний колір карток */
            --border-card: #203033;    /* Стриманий холодний контур */
            --primary: #4d7c7b;        /* Сутінкова туманна бірюза */
            --ice-accent: #a5c7c5;     /* Крижано-місячний відтінок */
            --text-main: #dce7e6;      /* Бліде туманне світло */
            --text-muted: #6f8685;     /* Приглушений сутінковий сірий */
            --link-color: #6fb0ad;     /* Холодний бірюзовий лінк */
        }

        /* Статичний суцільний темний фон без градієнтів — жодного мерехтіння */
        html, body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 20px 15px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            background-color: var(--bg-card);
            border: 1px solid var(--border-card);
            padding: 22px 20px;
            border-radius: 12px;
            margin-bottom: 18px;
            text-align: center;
        }

        .header h2 {
            font-family: 'Cinzel', serif;
            letter-spacing: 2px;
            color: var(--ice-accent);
            font-size: 1.6rem;
            margin: 0;
        }

        .header p {
            margin: 6px 0 0 0;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .controls {
            margin-bottom: 18px;
        }

        #subgroup-select {
            display: none;
        }

        input[type="date"] {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-card);
            background-color: var(--bg-card);
            color: var(--ice-accent);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            outline: none;
            color-scheme: dark;
        }

        input[type="date"]:focus {
            border-color: var(--primary);
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px 16px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .tab:hover {
            color: var(--ice-accent);
            border-color: var(--primary);
        }

        .tab.active {
            background-color: #1a2a2d;
            border-color: var(--primary);
            color: #ffffff;
        }

        .lesson-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-card);
            border-left: 5px solid var(--primary);
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 12px;
        }

        .lesson-time {
            font-weight: 600;
            color: var(--ice-accent);
            letter-spacing: 0.5px;
            font-size: 0.95rem;
        }

        .name {
            font-weight: 600;
            font-size: 1.05rem;
            color: #ffffff;
            margin-top: 4px;
        }

        .lesson-details {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-top: 6px;
            line-height: 1.4;
        }

        .lesson-link {
            display: inline-block;
            margin-top: 10px;
            color: var(--link-color) !important;
            text-decoration: underline !important;
            font-size: 0.88rem;
        }

        .subgroup-label {
            display: none !important;
        }

        #content-area h3 {
            font-family: 'Cinzel', serif;
            letter-spacing: 1px;
            color: var(--ice-accent);
            border-bottom: 1px solid var(--border-card);
            padding-bottom: 8px;
            margin: 18px 0 12px 0;
            font-size: 1.15rem;
        }

        #content-area h4 {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.8px;
            color: var(--primary);
            border-bottom: 1px solid var(--border-card);
            padding-top: 14px;
            padding-bottom: 6px;
            margin: 8px 0 8px 0;
            font-size: 1rem;
        }

        .empty {
            color: var(--text-muted);
            padding: 10px 0;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Розклад групи ІР-31</h2>
        <p id="current-info-display"></p>
    </div>

    <div class="controls">
        <select id="subgroup-select" onchange="refreshView()">
            <option value="0" selected>Спільна</option>
            <option value="1">1 Підгрупа</option>
            <option value="2">2 Підгрупа</option>
        </select>
        <input type="date" id="date-picker" onchange="setView('day')">
    </div>

    <div class="tabs">
        <div class="tab active" id="tab-day" onclick="setView('day')">Сьогодні / Дата</div>
        <div class="tab" id="tab-week" onclick="setView('week')">На тиждень</div>
    </div>

    <div id="content-area"></div>
</div>

<script src="script.js"></script>
</body>
</html>
